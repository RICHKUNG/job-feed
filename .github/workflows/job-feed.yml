name: job-feed
on:
  schedule:
    # GitHub cron is best-effort and can run hours late (2026-11-17: the 10:17 run fired at 19:12).
    # Two slots, both well before the 7:46 AM ET job-hunt run (11:46 UTC in summer, 12:46 UTC in winter).
    - cron: "41 4 * * *"
    - cron: "17 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: job-feed
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed
        run: python3 job-feed/feed.py
      - name: Commit
        run: |
          git config user.name "job-feed bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/job-feed
          git diff --cached --quiet && exit 0
          git commit -q -m "job-feed: $(date -u +%FT%H:%MZ)"
          git push
